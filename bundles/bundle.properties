sector.cryon-landing.name = Landing
sector.cryon-landing.description = Landing coordinates recovered from ancient archives.\nA faint navigation signal originates inland.\nNearby defenses remain active.\n\nEstablish a foothold. Prepare to advance.
sector.cryon-extension.name = Extension
sector.cryon-extension.description = Coal deposits detected.\nTraces of ancient vegetation lie beneath the sand.\nThis world remained habitable for a long time. They called it their second home.\nNothing lasts forever.\n\nDestroy the enemy base. Establish a supply line.
sector.cryon-ridge.name = Ridge
sector.cryon-ridge.description = A narrow, wind-carved ridge.\nThe old road has been fortified.\nSurviving facilities bear identification marks similar to those of Crux.\n\nBreak the blockade. Continue inland.
sector.cryon-checkpoint.name = Checkpoint
sector.cryon-checkpoint.description = Plants still grow around the watchtower.\nAela's unusual spectrum gives the vegetation its distinctive colors.\nThe red giant damaged the environment, but did not erase all life.\nOxygen remains in the atmosphere.\n\nCapture the watchtower. Continue the advance.
sector.cryon-dunes.name = Dunes
sector.cryon-dunes.description = Open dune fields.\nWe came seeking the Interstellar Accelerator. The archives say it can take us to distant star systems.\nMalis forces are converging from every direction.\n\nEstablish defenses. Withstand the attack.
sector.cryon-ashes.name = Ashes
sector.cryon-aravis-aegis.name = Aegis
sector.cryon-aravis-aegis.description = The maintenance route reaches the accelerator's outer defenses.\nMalis is gathering heavy mechs to cut our supply line.\n\nBuild advanced industry using iron, manganese and nickel. Break through the outer defenses and destroy both enemy cores to open the road to the final stronghold.
sector.cryon-terminus.name = Terminus
sector.cryon-terminus.description = The Interstellar Accelerator lies ahead.\nTwo outposts and a central command fortress block the final approach. Malis reinforcements are still arriving.\n\nBreak through, destroy every enemy core and secure the accelerator ruins. End the Aravis campaign here.
sector.cryon-ashes.description = A former domed residential district.\nLife-support systems destroyed. Heavy weapons fire has scarred the wreckage.\nMalis built a fortress over the ruins.\nAn accelerator maintenance route survives beneath the city.\n\nTake the fortress. Recover the route data.
block.cryon-fractura.name = Fractura
block.cryon-fractura.description = An advanced nickel scattergun. Fires volleys of piercing rounds at approaching armored ground units.

block.cryon-dune-sand.name = Rippled Dune Sand
