# Aravis advanced industry and support
block.cryon-advanced-alloy-furnace.name = Advanced Alloy Furnace
block.cryon-advanced-alloy-furnace.description = Mass-produces armor alloy or ashes alloy at four times the starter furnace throughput, using the same material ratios and more power. Optional water cooling: 12 water/second for 50% faster production. Operates at normal speed without water.
block.cryon-advanced-mech-reconstructor.name = Advanced Mech Reconstructor
block.cryon-advanced-mech-reconstructor.description = Upgrades Obsidianum mechs into T3 Nitrum flamethrower mechs. Optional water cooling: 9 water/second for 50% faster production. Operates at normal speed without water.
block.cryon-afterglow-cannon.name = Scorched Earth
block.cryon-afterglow-cannon.description = Bombards a wide ground area with volleys of ashes-alloy cluster shells that scatter incendiary submunitions on impact.
block.cryon-aravis-regen-projector.name = Ember Regen Projector
block.cryon-aravis-regen-projector.description = Consumes power to continuously regenerate damaged buildings within range.

block.cryon-coal-burner.name = Coal Burner
block.cryon-coal-burner.description = Burns coal to generate steady power for early mining and smelting. Requires no liquids.

block.cryon-dune-sand-wall.name = Dune Sand Wall

# Aravis cores and engineers
block.cryon-core-conquest.name = Conquest Core
block.cryon-core-conquest.description = The starting Aravis core, equipped with a Vindex engineer.
block.cryon-core-dominion.name = Dominion Core
block.cryon-core-dominion.description = Upgrades the Conquest Core with more storage and unit capacity. Deploys the Imperator engineer.
unit.cryon-vindex.name = Vindex
unit.cryon-vindex.description = The Conquest Core engineer. Builds, mines basic resources, and fires glowing repair pulses that damage enemy units and heal allied buildings without damaging enemy buildings.
unit.cryon-imperator.name = Imperator
unit.cryon-imperator.description = The Dominion Core engineer. Builds and mines faster, extracts nickel, carries more resources, and fires radiant repair bolts that damage enemy units and heal allied buildings without damaging enemy buildings.

ability.fluxsuppression = Flux Suppression Field
ability.fluxsuppression.description = Disables enemy building and unit flux barriers within {0} tiles. Barriers resume outside the field. Ordinary shields are unaffected.
unit.cryon-benignitas.description = Light three-mount fortress. A central scatter cannon and paired flamethrowers suppress ground groups and nearby flux barriers.
unit.cryon-salus.description = Five-mount assault fortress. Orange orbs shed homing rounds while paired arc guns and missiles cover the advance. Suppresses enemy flux barriers.
unit.cryon-propugno.description = Seven-mount breach fortress. A charged laser, piercing burst cannons, homing missiles and independent anti-air guns cover distinct targets. Suppresses enemy flux barriers.
unit.cryon-ratio.description = Nine-mount heavy fortress. A central siege cannon combines with heat beams, piercing guns, missiles and independent anti-air guns. Suppresses enemy flux barriers.
unit.cryon-veritas.description = Thirteen-mount mobile fortress. Charged helix orbs combine with laser-deploying homing pods, artillery, heat beams, burst guns, missiles and independent anti-air guns. Suppresses enemy flux barriers.
unit.cryon-ratio.name = Ratio
unit.cryon-veritas.name = Veritas

ability.globalsuppression = Total Suppression Field
ability.globalsuppression.description = Stops hostile buildings within {0} tiles and suppresses enemy flux barriers. Buildings resume outside the field or when the source dies, retaining their original enabled state.

# Aravis water infrastructure
block.cryon-aeolian-pump.name = Aeolian Water Pump
block.cryon-aeolian-pump.description = A 3x3 surface pump. Pumps 18 water/second on a full water footprint, using 120 power/second. Partial water coverage reduces output. Supplies production cooling and turrets.
block.cryon-aeolian-conduit.name = Aeolian Conduit
block.cryon-aeolian-conduit.description = Transports liquids. Built using local Aravis materials.
block.cryon-aeolian-liquid-router.name = Aeolian Liquid Router
block.cryon-aeolian-liquid-router.description = Distributes liquids to adjacent pipes and buildings.
block.cryon-aeolian-liquid-junction.name = Aeolian Liquid Junction
block.cryon-aeolian-liquid-junction.description = Allows two liquid pipelines to cross.
block.cryon-aeolian-liquid-bridge.name = Aeolian Liquid Bridge
block.cryon-aeolian-liquid-bridge.description = Transports liquids across up to 4 tiles without power.
block.cryon-metallurgical-furnace.description = Smelts metals and alloys. Optional water cooling: 6 water/second for 50% faster production. Operates at normal speed without water.
block.cryon-mech-unit-factory.description = Produces mechs using resources. Optional water cooling: 6 water/second for 50% faster production. Operates at normal speed without water.
block.cryon-mech-unit-reconstructor.description = Upgrades mechs to the next tier. Optional water cooling: 9 water/second for 50% faster production. Operates at normal speed without water.

block.cryon-aravis-unit-repairer.name = Aeolian Unit Repairer
block.cryon-aravis-unit-repairer.description = Uses power to repair damaged allied units within 12 tiles at 36 health/second. Optional cooling consumes 6 water/second for 50% faster repair. Works without water.

block.cryon-aeolian-turbine-generator.name = Aeolian Turbine Generator
block.cryon-aeolian-turbine-generator.description = Burns coal to heat surface water and drive a turbine. A 3x3 industrial generator producing 360 power/second, consuming 1 coal and 12 water/second. Fuel or water shortages reduce or stop generation.

unit.cryon-nitrum.description = A close-range assault flamethrower mech. Twin continuous flames melt nearby targets and break dense defenses. Reinforced armor and improved mobility let it advance while firing, but it must close the distance to deliver its damage.
unit.cryon-nitrum.name = Nitrum

block.cryon-team-flag-projector.name = Team Emblem Projector
block.cryon-team-flag-projector.description = Projects a large floating native team emblem glowing in its team color. Requires power; projection shuts off without power.

block.cryon-disarmament.name = Disarmament
block.cryon-disarmament.description = A strategic anti-nuclear missile silo. Consumes large quantities of materials and power to intercept hostile Java Processor nuclear strikes targeting its 80-tile coverage area. Neutralized warheads produce only a large harmless light sphere.
bar.cryon-anti-nuke-charge = Anti-nuclear charge {0}%

