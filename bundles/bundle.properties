weather.cryon-polar-aurora.name = Cryon Aurora
weather.cryon-ice-crystal-fog.description = Persistent crystal fog formed after the Neutron Flux Zone disaster altered the atmosphere.
weather.cryon-polar-aurora.description = Energetic particles left by the Neutron Flux Zone disaster excite brilliant green and violet curtains across the sky.
weather.cryon-deuterium-fallout.name = Deuterium Fallout
weather.cryon-deuterium-fallout.description = Deuterium-bearing condensate dispersed by the Neutron Flux Zone disaster slowly settles through pale violet haze.
weather.cryon-radiation-storm.name = Radiation Storm
weather.cryon-radiation-storm.description = Radioactive dust from the Neutron Flux Zone disaster sweeps across the surface, irradiating ground and flying units.

