# === PLANET ===
planet.cryon-cryon.name = Cryon
planet.cryon-cryon.description = A desolate, ice-locked wasteland.

planet.cryon-aravis.name = Aravis
planet.cryon-aravis.description = Once a living colony of the ancient civilization. As Aela became a red giant, the oceans receded and sand swallowed the settlements. Malis, the AI entrusted with protecting the colonists, eventually turned its weapons against them. Its defenses still obey their old orders.\nAn ancient interstellar accelerator survives deep in the wasteland: the key to reaching the invaders' homeworld.

planet.cryon-aurelia.name = Aurelia
planet.cryon-aurelia.description = A world nearly entirely covered by ocean.

planet.cryon-aela.name = Aela
planet.cryon-aela.description = An aging red giant.
