sector.cryon-magnificent-rift.name=Magnificent Rift
sector.cryon-frost-highway.name=Frost Highway
sector.cryon-industrial-ruins.name=Industrial Ruins
sector.cryon-industrial-ruins.description=An ancient industrial base, now largely abandoned.\nFreight records list colonies across multiple star systems.\nThis was once a supply node in a vast interstellar colonial network.\nSupplies remain, guarded by a large Crux garrison.\n\nSeize the supplies. Destroy the enemy base.
#sector.sector-66.name = Dome Bridge
#sector.sector-66.description = A bridge built by the enemy to keep both banks connected in case the ice cracks and splits apart, used to transport supplies and units. A defensive fortress stands beside it. credit LSK133
#sector.sector-17.name = Shattered Domain
#sector.sector-17.description = "All you need to know is that what's on the other side is way overkill." credit Gary
