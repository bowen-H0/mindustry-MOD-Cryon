# === Intent
co.mine = Approach to mine.
co.welcome = Welcome to Cryon.\n\nThis is [accent]Cryon[],\nmay you have a pleasant time here.
nf.mission = This is the Neutron Flux Egress Zone.\nThe enemy has established defenses here; a frontal assault could be costly.\nEnemy reinforcements will arrive periodically.\n[accent]Strike fast and decisively[],\nuse your starting units to capture a core.

fb.mission = The enemy fortress is exceptionally sturdy.\nYou will need to produce [accent]T3[] units to mount an assault.\nBuild one [accent]T3 Umbra[].\n\nThe enemy will begin production in [accent]10 minutes[].
