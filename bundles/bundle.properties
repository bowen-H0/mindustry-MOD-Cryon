sector.cryon-cryon-sector-1.description = The starting point of the clearing operation.\nThe defensive network is dilapidated. Few hostile units remain.\n\nEstablish a beachhead. Eliminate the remaining resistance.

sector.cryon-cryon-ice-shoal.description = A coastal stretch covered in crushed ice and gravel.\nOpen terrain. Low threat.\nScattered shipwrecks still bear route markings for different colony worlds.\n\nEstablish an initial foothold.

sector.cryon-cryon-sector-glacial-basin.description = A vast frozen basin. Usable resources are present in the area. The enemy has established a small-scale logistics outpost here. Destroy the outpost to cut off local supply lines.

sector.cryon-cryon-sector-shattered-shoal.description = Surface riddled with ravines and fissures, fragmented and chaotic. This is the buffer zone of the enemy base, littered with wreckage of destroyed structures. Numerous dangerous hostiles patrol the area. Study the debris to extract usable technology.

sector.cryon-cryon-sector-frost-outpost.description = An enemy forward outpost heavily fortified with extensive military defensive installations. Gather sufficient forces to eliminate this outpost.

sector.cryon-cryon-shattered-abyss.description = Located at the bottom of a deep canyon, dimly lit and covered in rubble. The harsh terrain allows construction only along rock fissures. The enemy has established a critical outpost here and will deploy substantial air support. Destroy it swiftly.

sector.cryon-cryon-gravel-ice.description = A barren wasteland of jagged rocks and rugged natural terrain. Reconnaissance indicates a significant number of elite enemy units are entrenched in this sector. Maintain maximum alert.

sector.cryon-cryon-neutron-flux-zone.description = A former base devastated by a catastrophic battle. A massive explosion scattered radiation across the planet; helium-3 remains detectable to this day. Ice crystal fog, intense auroras, deuterium fallout, and radiation storms are lasting scars of that disaster.\nCrux established a research base among the ruins.\nSeize the technical data and destroy the remaining facilities.

sector.cryon-cryon-fusion-bastion.description = The enemy's primary fortress. The terrain is suitable for large-scale manufacturing, and numerous factories operate here, producing combat units for the entire region. Breach the defenses and destroy this bastion.
sector.cryon-laboratory-088.description=An ancient technology research facility.\nTechnologies from colony worlds were brought to Cryon for adaptation and improvement.\nSome machines still process records from worlds that fell silent long ago.\nCrux controls the facility.\n\nCapture the facility. Recover the research data.
sector.cryon-desolate-zone-87.description=A desolate wasteland with lingering enemy activity. Exercise caution when exploring this area.
sector.cryon-titanium-fortress.description=An enemy frontline defense rich in titanium ore. Destroy the defensive installations to break through the line.
sector.cryon-silent-tundra.description=A small ice plain located behind the Titanium Fortress. Enemy activity has been detected here. Remain vigilant.
sector.cryon-relay-32a.description=A Crux signal relay station.\nAttempts are underway to reconnect abandoned ancient defense satellites and restore their strike capability.\n\nRecover the technology. Destroy the relay facilities.
sector.cryon-stellar-observatory.description=An ancient astronomical observatory.\nExtensive observation data has been intercepted. One set of coordinates points to a distant planet.\nThe connected orbital strike system was originally intended to repel invaders approaching from orbit.\nCrux still controls these facilities.\n\nDestroy the defenses. Recover the complete data.
sector.cryon-exclusion-zone.description=A former power generation complex.\nAn explosion tore the facilities apart.\nAdvanced technology survives among the ancient wreckage.\nCrux has stationed large forces here.\n\nSeize the ruins. Research the remaining technology.
sector.cryon-baryon-bastion.description=A fortress responsible for the continuous production of enemy forces. Capture this location to acquire Surge Alloy technology.
sector.cryon-titanium-fortress.name = Titanium Fortress
sector.cryon-silent-tundra.name = Silent Tundra
