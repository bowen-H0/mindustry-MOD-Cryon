sector.cryon-cryon-neutron-flux-zone.name = 中子流逸区
sector.cryon-cryon-sector-1.name = 克莱恩 第一区
sector.cryon-cryon-sector-frost-outpost.name = 寒锋前哨
sector.cryon-cryon-sector-glacial-basin.name = 冰川盆地
sector.cryon-cryon-sector-shattered-shoal.name = 碎裂浅滩
sector.cryon-cryon-shattered-abyss.name = 破碎深渊
sector.cryon-cryon-sector-1.description = 清剿行动的起点。\n防御网络已经老化失修，敌对单位稀少。\n\n建立滩头阵地，清除残余抵抗。

sector.cryon-cryon-ice-shoal.description = 碎冰与砾石覆盖的沿海地带。\n地形开阔，威胁等级低。\n散落的飞船残骸上，仍可辨认出不同殖民星球的航线标记。\n\n建立初期据点。

sector.cryon-cryon-sector-glacial-basin.description = 广阔冰封盆地。低海拔区域温度较高，冷冻液在此保持液态。\n侦测到可用资源与敌方后勤前哨。\n摧毁前哨，切断补给线。
sector.cryon-cryon-sector-shattered-shoal.description = 地表布满沟壑与裂隙，破碎而混乱。\n这里是敌方基地的缓冲区，散落着旧时要塞残骸。\n大量危险敌对单位在此巡逻。\n研究这些残骸可提取可用科技。

sector.cryon-cryon-sector-frost-outpost.description = 敌方的前沿哨站，配备大量军事防御设施，防守严密。需集结足够兵力才能将其摧毁。

sector.cryon-cryon-shattered-abyss.description = 位于深邃峡谷底部，光线昏暗，遍布瓦砾。敌人在此建立了关键前哨站，并将部署大量空中支援，需迅速将其摧毁。

sector.cryon-cryon-gravel-ice.description = 一片布满嶙峋岩石与崎岖地形的荒芜之地。侦察显示大量精锐敌方单位驻扎于此，需保持最高警惕。

sector.cryon-cryon-neutron-flux-zone.description = 这里曾是一座基地，爆发过一场惨烈的大战。一次巨型爆炸将大量辐射扩散至全球，至今仍能检测到大量氦-3。冰晶雾、异常强烈的极光、氘飘落与辐射风暴，都是这场灾难留下的痕迹。\nCrux 在废墟上建立了研究基地。\n夺取技术数据，摧毁剩余设施。\n那次冲击可能与此地有关。

sector.cryon-cryon-fusion-bastion.description = 敌人的主要堡垒。此处地形适合大规模制造，众多工厂在此运转，为整个区域生产战斗单位。需突破防线，摧毁这座堡垒。

sector.cryon-laboratory-088.description=古文明留下的技术研究设施。\n曾将各殖民星球的技术引入克莱恩，进行适应性改造与性能改进。\n部分设备仍在处理来自早已失联星球的资料。\nCrux 控制着这里。\n\n攻克设施，夺取研究数据。

sector.cryon-desolate-zone-87.description=这是一片荒芜的废地，敌人仍有活动迹象。探索此地时请保持警惕。

sector.cryon-titanium-fortress.description=这是一座富含钛矿的敌方前线防线。摧毁此地的防御设施以突破防线。

sector.cryon-silent-tundra.description=位于钛金要塞后方的小型冰原。\n干冰与水冰覆盖地表，冰层下检测到微弱的疑似生物信号。\n\n检测到敌方活动迹象，保持警惕。

sector.cryon-relay-32a.description=Crux 的信号中继站。\n正在尝试接入轨道上废弃的古文明防御卫星，恢复其打击能力。\n\n夺取技术，摧毁中继设施。
sector.cryon-exclusion-zone.description=曾经的巨型发电基地。\n一场爆炸将设施撕成废墟。\n古老残骸中仍留有先进技术。\nCrux 派遣大量部队驻守此地。\n\n夺取废墟，研究残存科技。

sector.cryon-baryon-bastion.description=这是一座负责持续生产敌军的堡垒。攻克此地以夺取巨浪合金科技。


sector.cryon-laboratory-088.name=实验区 088
sector.cryon-eroded-wastes.name=蚀尽荒原
sector.cryon-eroded-wastes.description=实验区附近的一片荒原。\n敌军将发动猛烈攻势。建立防线，坚守阵地，消灭来袭部队。

sector.cryon-desolate-zone-87.name=荒芜地带 087

sector.cryon-titanium-fortress.name=钛金要塞

sector.cryon-silent-tundra.name=宁静冰原

sector.cryon-relay-32a.name=通讯区32A

sector.cryon-stellar-observatory.name=天体观测站
sector.cryon-stellar-observatory.description = 古老的天文观测站。\n已截获大量观测数据，其中一组坐标指向遥远的星球。\n这里连接着轨道打击系统，原本用于抵御来自轨道的入侵者。\n如今，Crux 仍控制着这些设施。\n\n摧毁防御设施，夺取完整数据。
sector.cryon-exclusion-zone.name=毁灭禁区

sector.cryon-baryon-bastion.name=重晶要塞
sector.cryon-magnificent-rift.name=宏伟裂谷
sector.cryon-magnificent-rift.description = Crux 在此开采矿物。\n裂谷地形被改造成重型防线。\n摧毁防御设施，夺取矿区。
sector.cryon-frost-highway.name=冰谷干道
sector.cryon-frost-highway.description = 曾经的主干道，现已废弃。\n地表覆盖金属，地形开阔，适合大规模装甲进攻。\nCrux 将在此派遣大量陆军。\n\n建立防线，抵御进攻。
sector.cryon-twilight-icefield.name=暮光冰原
sector.cryon-twilight-icefield.description = 大型敌方基地。\nCrux 在此部署最后防线。\n密集防御网络，大量驻军。\n突破外围防线，摧毁核心。

sector.cryon-desolate-plain.name=荒芜平原
sector.cryon-desolate-plain.description = 最终目标。\nCrux 在此集结大量兵力，进行决战。\n侦测到一台极其罕见的高危单位。\n清除所有抵抗。
sector.cryon-industrial-ruins.name=工业废墟
sector.cryon-industrial-ruins.description=曾经用来生产大量物资的工业基地，而现在只剩下了一片废墟，这里有大量物资，同时也有大量敌人在此驻守。
sector.cryon-outer-belt.name=环带
sector.cryon-outer-belt.description=由于这里独特的气候，以及这里平坦的地形和极为丰富的资源，Crux决定将这里改造成宜人的城市。当你降落此地时，敌人将不惜一切代价从四面八方进攻。在敌人到来之前，请做好充足的准备来应对敌人。


sector.cryon-landing.name=着陆点
sector.cryon-landing.description=古文明档案标注的登陆区域。\n接收到来自内陆的微弱导航信号。\n附近防御设施仍在运转。\n\n建立据点，准备向内陆推进。

sector.cryon-extension.name=延展区
sector.cryon-extension.description=侦测到煤炭矿藏。\n沙层之下，埋藏着古老植被的痕迹。\n这里曾宜居了很长时间，被称为第二家园。\n可惜，万物并非永恒。\n\n摧毁敌人基地，建立补给线。

sector.cryon-ridge.name=山脊
sector.cryon-ridge.description=风蚀形成的狭长山脊。\n旧道路被改造成防线。\n残存设施上留有与 Crux 相似的识别标记。\n\n突破封锁，继续推进。
sector.cryon-checkpoint.name=检查站
sector.cryon-checkpoint.description=哨塔周围仍有植物生长。\n艾拉独特的光谱，使这里的植被呈现出不同寻常的颜色。\n红巨星破坏了环境，但生态并未完全消失。\n大气中仍含有氧气。\n\n夺取哨塔，继续推进。

sector.cryon-dunes.name=沙丘
sector.cryon-dunes.description=开阔的沙丘地带。\n我们为寻找星际加速器而来。档案记载，它能让我们抵达遥远的星系。\nMalis 的部队正从四面八方赶来。\n\n建立防线抵御进攻。
sector.cryon-ashes.name=残烬
sector.cryon-aravis-aegis.name=神盾
sector.cryon-aravis-aegis.description=维护线路通向加速器外围的防御阵地。\nMalis 正调集重型机甲，试图切断我们的补给。\n\n利用铁、锰和镍矿建立后期工业，突破外围防线，摧毁两座敌方核心，打开通往终点的道路。
sector.cryon-terminus.name=终章
sector.cryon-terminus.description=星际加速器就在前方。\n两座前哨与中央指挥要塞封锁了最后的通道，Malis 的增援仍在抵达。\n\n突破防线，摧毁全部敌方核心，夺取加速器遗址。阿拉维斯的远征将在这里迎来终章。
sector.cryon-ashes.description=曾经的穹顶居住区。\n维生设施已被摧毁，残骸留有密集交火痕迹。\nMalis 在废墟上建造了要塞。\n城区地下仍有通往加速器的维护线路。\n\n攻下要塞，夺取线路数据。


block.cryon-fractura.name=破碎
block.cryon-fractura.description=高级镍弹散射炮塔。齐射穿甲弹丸，拦截逼近的地面重装单位。

