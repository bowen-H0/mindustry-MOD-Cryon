block.cryon-porphyra-etch.description = 发射高速穿甲弹，贯穿敌方单位与建筑。
block.cryon-porphyra-excite.description = 发射多束近程电弧，电击地面目标。无法攻击空军。
block.cryon-porphyra-pulse.description = 双管交替发射瞬时脉冲激光，贯穿射线上的敌方单位。
block.cryon-porphyra-dissociate.description = 喷射伽马盐液浸湿敌人，或喷射熔晶浆、等离子液造成高温伤害。
block.cryon-porphyra-deflect.description = 发射对空爆破弹，拦截成群飞行单位。
block.cryon-porphyra-glow.description = 持续照射目标的高能激光炮。
block.cryon-porphyra-detune.description = 向远处发射重型炮弹，轰击地面目标。
block.cryon-porphyra-overload.description = 发射追踪导弹，爆炸时释放多道电弧，打击空中和地面目标。
block.cryon-porphyra-critical.description = 充能后释放贯穿目标的高能射线。
block.cryon-porphyra-collapse.description = 发射重型曲射炮弹，大范围爆炸后释放电弧破片。仅攻击地面目标。
block.cryon-porphyra-sorter.name = 晶格分类器
block.cryon-porphyra-unloader.name = 晶格卸载器
block.cryon-porphyra-mass-driver.name = 晶格质量驱动器
block.cryon-ring-control-center.name = 星环控制中心
block.cryon-ring-control-center.description = 星环防御网络的权限核心。夺取它即可关闭覆盖波菲拉的防御网络。
cryon.porphyra.victory = 星环权限已夺取。行星防御网络关闭。波菲拉已被征服。
unit.cryon-receptor.description = 近距脉冲切割，瞬间扫过一条狭长区域。
unit.cryon-synapse.description = 三连电弧弹，命中时放电并施加电击。
unit.cryon-ganglion.description = 追踪的波动能量球，以缓速效果扰乱敌群。
unit.cryon-cortex.description = 驻留照射的持续束流，开火时降低移动速度。
unit.cryon-connectome.description = 充能三向光束与近距电弧，交替压制多个方向。
unit.cryon-monomer.description = 高速穿甲炮，贯穿轻装目标。
unit.cryon-dimer.description = 双管交替发射，持续输出穿透火力。
unit.cryon-oligomer.description = 四发延时炮击，以散布覆盖地面阵地。
unit.cryon-polymer.description = 停驻充能贯穿炮，配备独立防空爆破副炮。
unit.cryon-macromolecule.description = 重型宽幅切割炮，辅以两侧三连攻城迫击炮。
unit.cryon-particle.description = 快速三连点射，适合高速掠袭。
unit.cryon-momentum.description = 连续发射四枚追踪导弹。
unit.cryon-inertia.description = 连续投射五枚重型炸弹，轰击地面集群。
unit.cryon-gravity.description = 持续压制激光与两侧追踪导弹舱。
unit.cryon-singularity.description = 发射牵引敌人与吞噬弹丸的引力井，辅以双侧脉冲光束。

# Planet environmental traits
status.cryon-heat-stress.name = 热应激
status.cryon-heat-stress.description = 热环境不适配：移动速度降至70%、伤害65%、射速65%、建造速度60%、最大生命75%。离开热环境后恢复。
status.cryon-cold-stress.name = 低温失效
status.cryon-cold-stress.description = 冷环境不适配：移动速度降至60%、伤害80%、射速60%、建造速度60%、最大生命80%。离开冷环境后恢复。
status.cryon-crystallized.name = 水晶雕塑
status.cryon-crystallized.description = 不适配重结晶环境的单位将直接被移除，转化为保留外形和朝向的水晶雕塑方块；雕塑可被破坏，且不占单位名额。
stat.cryon-heat-adaptation = 热环境适配
stat.cryon-cold-adaptation = 冷环境适配
stat.cryon-crystal-adaptation = 重结晶适配
cryon.environment.planet-cold = 环境属性：冷。单位默认耐寒；埃里克尔单位不耐寒并受到低温削弱。克莱恩与波菲拉本土单位耐寒。
cryon.environment.planet-heat = 环境属性：热。单位默认适配；克莱恩单位不默认免疫热。耐炽热单位同时免疫普通热环境。
cryon.environment.planet-final = 环境属性：炽热、重结晶。炽热使用原版环境判定；不适配重结晶的单位将永久变成水晶雕塑。波菲拉本土单位耐炽热、耐寒，且免疫重结晶。
block.cryon-crystal-statue.name = 水晶雕塑
block.cryon-crystal-statue.description = 重结晶留下的单位雕塑，可破坏的静态方块。
block.cryon-crystal-statue-2.name = 水晶雕塑
block.cryon-crystal-statue-2.description = 重结晶留下的单位雕塑，可破坏的静态方块。
