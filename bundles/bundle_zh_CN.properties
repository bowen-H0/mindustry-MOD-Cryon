#RBMK
block.cryon-fuel-rod.name = 燃料棒
block.cryon-fuel-rod.description = 装载中子燃料，在中子作用下发生裂变，释放热量并产生更多中子。燃料耗尽后停止反应，过热或被摧毁时会引发核爆。

block.cryon-moderator-rod.name = 慢化剂棒
block.cryon-moderator-rod.description = 将快中子慢化为慢中子，提高反应堆内慢中子的比例。

block.cryon-neutron-reflector.name = 中子反射板
block.cryon-neutron-reflector.description = 反射大部分入射中子，减少中子泄漏，提高反应堆的中子利用率。

block.cryon-control-rod.name = 控制棒
block.cryon-control-rod.description = 通过调节插入深度吸收中子，控制反应堆的反应强度。注意：石墨头可能在插入初期引发短暂的反应性上升。

block.cryon-neutron-source.name = 中子源
block.cryon-neutron-source.description = 持续释放快中子，为反应堆启动提供中子。可通过启用或停用控制中子源。

block.cryon-stirling-generator.name = 斯特林发电机
block.cryon-stirling-generator.description = 利用反应堆传导的热量发电。温度越高，发电效率越高；热量不足时无法正常发电。

block.cryon-reactor-feeder.name = 反应堆进料器
block.cryon-reactor-feeder.description = 将物品远距离输送至指定燃料棒，无需直接连接反应堆部件。可在范围内自动寻找燃料棒，也可手动设置连接目标。

block.cryon-reactor-controller.name = 反应堆控制模块
block.cryon-reactor-controller.description = 自动监测附近反应堆部件的最高温度，并调节已连接控制棒的插入深度，以控制反应强度、降低熔毁风险。可连接多个控制棒。

block.cryon-heat-pipe.name = 导热管道
block.cryon-heat-pipe.description = 吸收并传导热量，将水加热为热蒸汽，也可将冷蒸汽重新加热。矿渣可在管道内燃烧放热。管道过热或压力过高时可能发生爆管。

block.cryon-heat-pipe-router.name = 导热管道路由器
block.cryon-heat-pipe-router.description = 将流体向前方及左右两侧分流。可设置流体分类，仅允许指定流体通过。不能与普通流体管道连接。

block.cryon-condenser.name = 冷凝器
block.cryon-condenser.description = 消耗电力，将冷蒸汽冷凝为水。需要连接导热管道系统输入冷蒸汽，并通过导热管道系统输出水。

block.cryon-steam-turbine.name = 蒸汽轮机
block.cryon-steam-turbine.description = 消耗热蒸汽发电，并输出冷蒸汽。冷蒸汽可送入冷凝器重新转化为水，形成循环。冷蒸汽输出受储存容量限制。

liquid.cryon-cold-steam.name = 冷蒸汽
liquid.cryon-cold-steam.description = 蒸汽轮机输出的低温气态流体。可由冷凝器冷凝为水，也可在导热管道中吸热重新转化为热蒸汽。

liquid.cryon-hot-steam.name = 热蒸汽
liquid.cryon-hot-steam.description = 水或冷蒸汽在高温导热管道中吸热后形成的高温气态流体。可输入蒸汽轮机发电。


