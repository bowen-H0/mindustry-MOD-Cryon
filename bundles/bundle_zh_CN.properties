cryon.dialogue.crux.enemy = 是你们！消灭他们！

cryon.dialogue.malis.negotiate = 既然你们主动建立通讯，想必已经准备好了足够有价值的条件。










cryon.dialogue.player.silence = ……
cryon.dialogue.malis.reconnect = 当然。重新审视一项协议，从来不是坏事。那么，这次你们希望讨论什么？
cryon.dialogue.pioneer.allied-return = 欢迎回来，盟友。我们的战略部署正在按计划推进。请说明你们此次通讯的目的。
cryon.dialogue.pioneer.refused-return = 通讯已建立。你们再次联系我们，并不令人意外。我们的提议依然有效，而Crux的覆灭仍是既定目标。那么，你们改变主意了吗？

cryon.dialogue.player.wary = 合作？我们凭什么相信你们？

cryon.dialogue.player.question = 直接说明条件。你们能提供什么，又需要我们做什么？

cryon.dialogue.player.consider = 地下勘探技术，换取针对Crux的军事合作……这项交易确实有一定价值。

cryon.dialogue.player.refuse = 我们已经评估了你们的提议。目前没有足够的理由接受这项协议。谈判结束。

cryon.dialogue.player.agree = 条件可以接受。我们同意结盟，共同对抗Crux。但我们的军事行动将由我们自行决定。



cryon.dialogue.pioneer.offer = 我们已经对当前局势进行了充分评估。Crux的扩张必须得到终结，而我们有能力实现这一目标。现在，我们向你们提出一项合作协议：共同消灭Crux。作为诚意，我们愿意共享部分先进技术。

cryon.dialogue.pioneer.explain = 你们的怀疑可以理解，但这并不影响我们的判断。Crux与我们之间不存在妥协的可能。他们必须被彻底消灭。你们可以选择独自面对这场战争，也可以加入我们。我们认为，后者显然更符合你们的利益。

cryon.dialogue.pioneer.final = 我们将向你们开放克莱恩地下区域的勘探资料，以及深海工程技术。这些技术将帮助你们突破冰层，建立地下作战能力。作为交换，我们要求你们参与针对Crux的军事行动，直至其威胁被彻底清除。这项协议对双方都有利。我们相信，你们能够作出合理的判断。

cryon.dialogue.pioneer.reject = 令人遗憾，但并不意外。你们拒绝了一个本可以互利的机会。不过，这不会改变我们的计划。Crux终将覆灭，无论你们是否参与。

cryon.dialogue.pioneer.accept = 很好。合作协议正式生效。地下通路坐标及相关技术资料正在传输。我们的目标已经一致。接下来，让我们结束Crux的存在。


