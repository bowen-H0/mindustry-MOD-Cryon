# Porphyra protocol trade and advanced production
item.cryon-protocol-point.name = 协议点
item.cryon-protocol-point.description = 用于星际交易的实体协议凭证。在协议编码器中消耗铼与伽马晶体制造。
item.cryon-laminated-rhenium.name = 层压铼
item.cryon-laminated-rhenium.description = 将铼与进口石墨压合而成的结构材料，用于先进工厂、反应堆和防御工事。
item.cryon-phase-crystal.name = 稳相晶体
item.cryon-phase-crystal.description = 由伽马晶体、进口硅和钷稳定加工，用于复杂生产与高阶单位设施。
item.cryon-porphyra-alloy.name = 波菲拉合金
item.cryon-porphyra-alloy.description = 层压铼、稳相晶体、进口钛与镎在等离子体中融合的高级合金。
block.cryon-porphyra-protocol-encoder.name = 协议编码器
block.cryon-porphyra-protocol-encoder.description = 消耗2铼、4伽马晶体及电力，每1.5秒制造1协议点。
block.cryon-porphyra-trade-tower.name = 交易塔
block.cryon-porphyra-trade-tower.description = 选择订单后输入协议点并供电，每3秒交易一次。8点换10硅，4点换10石墨，6点换10钛。协议点与兑换产物各有120容量，协议点满仓仍可交易；产物满仓时暂停。
block.cryon-porphyra-rhenium-press.name = 铼层压机
block.cryon-porphyra-rhenium-press.description = 消耗3铼与1进口石墨，每1.5秒压制2层压铼。
block.cryon-porphyra-crystal-stabilizer.name = 晶体稳相炉
block.cryon-porphyra-crystal-stabilizer.description = 消耗3伽马晶体、2进口硅与1钷，每2秒制造2稳相晶体。
block.cryon-porphyra-alloy-forge.name = 波菲拉合金炉
block.cryon-porphyra-alloy-forge.description = 消耗层压铼、稳相晶体、进口钛、镎与等离子体，每3秒制造1波菲拉合金。
block.cryon-porphyra-plasma-condenser.name = 等离子冷凝器
block.cryon-porphyra-plasma-condenser.description = 消耗伽马晶体、镎与电力，以更高速度生产等离子体。
block.cryon-porphyra-laser-defense.name = 激光防御塔
block.cryon-porphyra-laser-defense.description = 自动用激光削减或摧毁范围内的敌方弹丸。追踪目标时耗电，不消耗弹药。无法拦截瞬时激光及不可拦截弹丸。
bar.cryon-trade-progress = 交易进度

bar.cryon-trade-points = 协议点：{0}/{1}
bar.cryon-trade-storage = 兑换产物：{0}/{1}

item.cryon-rhenium-plate.name = 铼板
item.cryon-rhenium-plate.description = 铼压制成的初级结构板，用于单位工厂和初级单位的装配。
block.cryon-porphyra-plate-press.name = 铼板压机
block.cryon-porphyra-plate-press.description = 消耗电力，每秒将2份铼压制为1份铼板。无需进口资源。

liquid.cryon-gamma-brine.name = 伽马盐液
liquid.cryon-gamma-brine.description = 低温含晶盐液，可从波菲拉侧部液池抽取。作为裂解炮弹药可浸湿敌人，配合电弧攻击。
block.cryon-porphyra-gamma-brine.name = 浅伽马盐液池
block.cryon-porphyra-gamma-brine-deep.name = 深伽马盐液池

liquid.cryon-crystal-slurry.name = 熔晶浆
liquid.cryon-crystal-slurry.description = 高温熔融晶浆，可抽取作裂解炮弹药，造成熔融。深池会淹没不能悬浮或飞行的单位。
block.cryon-porphyra-crystal-slurry.name = 浅熔晶浆池
block.cryon-porphyra-crystal-slurry-deep.name = 深熔晶浆池
block.cryon-porphyra-shore-pump.name = 波菲拉抽液泵
block.cryon-porphyra-shore-pump.description = 需要放在同种液体的液池上。通电抽取伽马盐液或熔晶浆，经导管送往储液罐或裂解炮。

# Cryon surface / underground campaign layers
planet.cryon-cryon-depths.name = 克莱恩·地下
planet.cryon-cryon-depths.description = 在克莱恩冰层下的红蓝海床建立前哨。海藻与珊瑚沿深海水道生长。初始船坞与热液发电机已连接；给船坞送入铝、镁和石墨即可生产首级舰船。与地表共用科技，两层区块进度独立。
cryon.layer.surface = 地表
cryon.layer.underground = 地下
sector.cryon-depths-outpost.name = 冰下前哨
sector.cryon-depths-outpost.description = 在克莱恩冰层下的红蓝海床建立前哨。海藻与珊瑚沿深海水道生长。初始船坞与热液发电机已连接；给船坞送入铝、镁和石墨即可生产首级舰船。与地表共用科技，两层区块进度独立。
sector.cryon-depths-strait.name = 潮汐海峡
sector.cryon-depths-strait.description = 守住礁床基地，抵御沿水道袭来的敌军。
sector.cryon-depths-archipelago.name = 断裂群岛
sector.cryon-depths-archipelago.description = 突破深海防线，摧毁敌方礁床核心。
sector.cryon-depths-corridor.name = 深蓝回廊
sector.cryon-depths-corridor.description = 守住礁床基地，抵御沿水道袭来的敌军。
sector.cryon-depths-vents.name = 深渊热泉
sector.cryon-depths-vents.description = 突破深海防线，摧毁敌方礁床核心。
sector.cryon-depths-nexus.name = 海底枢纽
sector.cryon-depths-nexus.description = 突破深海防线，摧毁敌方礁床核心。

