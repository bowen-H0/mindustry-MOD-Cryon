sector.cryon-cryon-sector-1.description = 最初的登陆区域。防御网络已经老化失修，敌对势力稀少，是建立滩头阵地的理想起点。

sector.cryon-cryon-ice-shoal.description = 一片覆盖着碎冰与砾石的沿海地带。地形开阔，威胁等级较低，适合建立初期据点。

sector.cryon-cryon-sector-glacial-basin.description = 一片广阔的冰封盆地，区域内存在可用资源。敌人在此建立了小型后勤前哨站，摧毁该前哨可切断当地补给线。

sector.cryon-cryon-sector-shattered-shoal.description = 地表布满沟壑与裂隙，破碎而混乱。这里是敌方基地的缓冲区，散落着被摧毁建筑的残骸。区域内有大量危险的敌对单位巡逻，研究这些残骸可提取可用的科技。

sector.cryon-cryon-sector-frost-outpost.description = 敌方的前沿哨站，配备大量军事防御设施，防守严密。需集结足够兵力才能将其摧毁。

sector.cryon-cryon-shattered-abyss.description = 位于深邃峡谷底部，光线昏暗，遍布瓦砾。恶劣的地形只允许沿岩石裂隙建造。敌人在此建立了关键前哨站，并将部署大量空中支援，需迅速将其摧毁。

sector.cryon-cryon-gravel-ice.description = 一片布满嶙峋岩石与崎岖地形的荒芜之地。侦察显示大量精锐敌方单位驻扎于此，需保持最高警惕。

sector.cryon-cryon-neutron-flux-zone.description = 一处仍在运作的研究与军事综合设施。这颗星球独有的科技诞生于此，塑造了整个区域的面貌。大规模的核设施使辐射水平极其危险，务必不惜代价夺取技术数据。

sector.cryon-cryon-fusion-bastion.description = 敌人的主要堡垒。此处地形适合大规模制造，众多工厂在此运转，为整个区域生产战斗单位。需突破防线，摧毁这座堡垒。
