cryon.radio.story.twilight-icefield.01.01 = 我们已经没有可以继续后撤的阵地。
cryon.radio.story.twilight-icefield.02.01 = 任何防线都不允许主动放弃。
cryon.radio.story.twilight-icefield.03.01 = 无论付出什么代价，都必须阻止 Sharded。
