block.cryon-abyss-frozen-silt.name = 冻凝沉积层
block.cryon-abyss-silica-crust.name = 硅质硬壳
block.cryon-abyss-ice-crystal-floor.name = 深海冰晶层
block.cryon-abyss-titanium-bed.name = 富钛海底矿床
block.cryon-abyss-nickel-bed.name = 富镍海底矿床
block.cryon-abyss-metal-nodules.name = 镍质结核层
