cryon.radio.story.baryon-bastion.title = 克莱恩 · 重晶要塞 · 监听频道
cryon.radio.story.baryon-bastion.01.01 = 立即启动全部防御系统。
cryon.radio.story.baryon-bastion.01.02 = 所有部队进入最高战备状态。
cryon.radio.story.baryon-bastion.02.01 = 所有预备部队立即进入阵地。
cryon.radio.story.baryon-bastion.02.02 = 不得擅自撤离。
cryon.radio.story.baryon-bastion.03.01 = 即使外围防线被突破，也必须继续抵抗。
