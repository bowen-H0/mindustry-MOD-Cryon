cryon.radio.story.neutron-flux-zone.title = 克莱恩 · 中子流溢区 · 监听频道
cryon.radio.story.neutron-flux-zone.01.01 = 你们已经多次无视我们的警告。
cryon.radio.story.neutron-flux-zone.02.01 = 所以呢？
cryon.radio.story.neutron-flux-zone.03.01 = 我们已经授权在该区域使用核武器。
cryon.radio.story.neutron-flux-zone.04.01 = 立即停止一切军事行动，并撤出中子流溢区。
cryon.radio.story.neutron-flux-zone.05.01 = 你们可以试试。
cryon.radio.story.neutron-flux-zone.06.01 = ……
cryon.radio.story.neutron-flux-zone.06.02 = 看来你们仍然没有意识到局势的严重性。
cryon.radio.story.neutron-flux-zone.07.01 = 最后通牒。
cryon.radio.story.neutron-flux-zone.07.02 = 立即撤离，否则我们将启动核打击程序。
cryon.radio.story.neutron-flux-zone.08.01 = 通讯结束。
