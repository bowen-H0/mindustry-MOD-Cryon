unit.cryon-eon.name = 熵尽
unit.cryon-eon.description = Eon，巨型飞船 Boss。相位爆炸主炮先引发远程爆炸，再坍缩吸附，最终复爆。两门速射轨道炮持续贯穿敌阵；两组引力陷阱与两组高维炸弹向四周布雷。高维屏障永久减免 90% 伤害，仅在受击处短暂显形。
unit.cryon-eon.details = 舰体生命 30000；高维屏障减伤后，未计护甲的等效耐久为 300000。相位主炮：首爆 7000，坍缩持续 2.5 秒，复爆 16000；爆炸向边缘衰减。相位损坏持续 4 秒：移速、攻击、装填与建造 ×0.8，护甲 ×0.75，有效生命 ×0.9，抑制生命恢复；下一次敌方直接弹体攻击造成五倍伤害。范围爆炸与持续伤害不触发暴击；刷新状态不会重复充能，状态消失后重新施加可再次触发。
status.cryon-phase-damage.name = 相位损坏
status.cryon-phase-damage.description = 全面削弱机动、攻击、装填、建造、护甲与有效生命，抑制生命恢复。下一次敌方直接弹体命中造成五倍伤害，每次连续状态仅触发一次。
ability.highdimensionbarrier = 高维屏障\n[stat]90%[lightgray] 伤害减免；沿舰体轮廓在受击处短暂显形。

block.cryon-orbital-barrier-node.name = 天基屏障节点
block.cryon-orbital-barrier-node.description = 克莱恩顶级防御设备。连接远距离节点，展开阻挡敌军与火力的平面天基屏障。需要庞大电力供应；冷却液加速恢复，相织布扩充护盾。节点被毁将沿网络引发连锁爆炸。
block.cryon-orbital-barrier-node.details = 9×9 大型防御阵列，连接范围 120 格，最多 4 条连接。屏障厚度 8 格，在外表面拦截敌军与火力。耗电 36000/秒，任意端点缺电即停盾。每个节点基础护盾 120000；相织布每 10 秒消耗 1 个，额外提供 80000 护盾。冷却液消耗 12/秒，恢复速度 ×2.4，过载冷却速度 ×2.5。断电时暂停恢复和材料消耗。护盾过载后暂时失效，节点被击毁才触发连锁爆炸，波及附近双方单位和建筑。
bar.cryon-orbital-shield = 屏障 {0} / {1}
bar.cryon-orbital-phase = 相织增幅 · 储备 {0}
bar.cryon-orbital-unstable = 连锁失控
bar.cryon-orbital-reboot = 过载冷却
bar.cryon-orbital-ready = 屏障就绪
bar.cryon-orbital-unpowered = 电力不足 · 屏障离线

block.cryon-nano-regeneration-matrix.name = 纳米再生矩阵
block.cryon-nano-regeneration-matrix.description = 消耗纳米材料和电力，释放覆盖广阔区域的再生绿雾，高速修复友方及盟友的建筑和单位。
block.cryon-nano-regeneration-matrix.details = 7×7 高阶治疗设备，半径 60 格。运行耗电 18000/秒，每 0.5 秒消耗 1 个纳米材料，最多储存 600 个。建筑每秒恢复 1200 + 最大生命的 30%，单位每秒恢复 1200 + 最大生命的 20%。断电、缺少材料、禁用或矩阵被治疗抑制时立即停疗，绿雾短暂消散。材料按每半秒一个预付，暂停时保留剩余批次；满血区域仍会持续消耗。
stat.cryon-nano-matrix-healing = 建筑：1200/秒 + 最大生命的 30%/秒；单位：1200/秒 + 最大生命的 20%/秒
bar.cryon-nano-reserve = 纳米材料 {0}
bar.cryon-nano-active = 再生雾场运行中
bar.cryon-nano-offline = 再生雾场离线

block.cryon-reality-anchoring-matrix.name = 现实锚定矩阵
block.cryon-reality-anchoring-matrix.description = 投射巨大的正方形现实锚定场，封锁敌军向场内传送及从场内传出。进入区域的敌方相位、构能、空间弹体伤害降低 50%。
block.cryon-reality-anchoring-matrix.details = 9×9 顶级防御设备。锚定场边长 160 格，耗电 28800/秒，每 0.2 秒消耗 1 个相织布。断电、缺料或禁用后立即解除锚定。普通弹体不受影响；盟军不受影响。相位弹体一旦进入便失去 50% 伤害，多个场不叠加。衍生弹体继承标签及减伤，覆盖直接伤害、爆炸与空间持续伤害。正方形边界与少量循环放大、淡出的空心正方形显示有效区域。
bar.cryon-anchor-active = 现实锚定生效
bar.cryon-anchor-offline = 现实锚定离线
stat.cryon-projectile-tags = 武器标签
tag.cryon-normal = 普通
tag.cryon-phase = 相位
tag.cryon-constructor = 构能
tag.cryon-spatial = 空间
tag.cryon-weapon = 武器 {0}

block.cryon-nano-reactor.name = 纳米反应堆
block.cryon-nano-reactor.description = 消耗电力、硅和钛，使库存中的纳米材料翻倍。保留一个种子并自动输出多余材料。被摧毁、库存溢出或高库存堵塞时发生纳米爆炸，留下持续扩散的纳米污染。
block.cryon-nano-reactor.details = 4×4，每轮 4 秒，库存中的每个纳米材料各消耗硅 1、钛 1，耗电 6000/秒，然后库存翻倍（1→2→4→8…）。库存 N 个时需要硅 N、钛 N，缺少任一种食物暂停整轮复制。纳米材料、硅、钛各最多储存 1024；每 5 帧最多输出 16 个。下一轮翻倍超过上限立即爆炸；库存达到 768 且连续 3 秒未成功输出也会爆炸，断电或禁用仍会检查堵塞。被摧毁始终爆炸，安全拆除不触发。爆炸波及所有阵营，库存越多范围和伤害越大。污染每秒从边缘蔓延一格（每波最多处理 128 个边缘），替换地面、矿物及自然墙体，并在读档后继续扩散。
block.cryon-nano-floor.name = 纳米地板
block.cryon-nano-floor.description = 活跃的纳米污染地面，会向相邻地块持续扩散，沿矿脉加速蔓延。非纳米陆地单位每秒受到 60 伤害，接触地面的非纳米建筑每秒受到 40 伤害。
block.cryon-nano-terrain-wall.name = 纳米墙
block.cryon-nano-terrain-wall.description = 被纳米污染同化的自然墙体。
block.cryon-nano-ore.name = 纳米矿
block.cryon-nano-ore.description = 由已有矿物同化而成，产出硬度 4 的纳米材料。普通地面不会随机生成纳米矿，开采不会清除污染。
stat.cryon-nano-replication = 当前纳米材料库存 ×2，保留 1 个种子；溢出将引爆
bar.cryon-nano-danger = 堵塞失控

stat.cryon-nano-food = 每个现有纳米材料每轮各消耗硅 1、钛 1；库存 N 需硅 N、钛 N，食物不足暂停复制。
block.cryon-nano-suppressor.name = 纳米压制器
block.cryon-nano-suppressor.description = 消耗电力，压制附近的失控纳米地块，使其停止扩散。
block.cryon-nano-suppressor.details = 3×3，压制半径 20 格，耗电 1800/秒。通电且启用时，范围内的纳米地板、墙和矿物不能向外扩散，外部污染也无法蔓延进范围。已有污染保留；断电、禁用、拆除或被摧毁后恢复扩散。多个压制器的覆盖可以叠加。不阻止反应堆爆炸及爆炸造成的直接污染。

team.nano.name = 纳米
block.cryon-rogue-nano-drill.name = 失控纳米钻头
block.cryon-rogue-nano-drill.description = 纳米灾难阵营专用的自生钻头，只开采纳米矿，采掘硬度 4，无需电力。
block.cryon-nano-machine-factory.name = 纳米机器工厂
block.cryon-nano-machine-factory.description = 消耗矿脉输送的纳米材料生产蚀虫。仅纳米阵营运行，正面三格必须为空地。
block.cryon-nano-machine-factory.details = 每 8 秒消耗 12 个纳米材料生产一只蚀虫，库存 120。正面三格被建筑、自然墙或无法行走的地面阻挡时暂停。出口有陆地单位时等待。殖群最多维持 128 只蚀虫。
block.cryon-rogue-nano-wall.name = 失控纳米墙
block.cryon-rogue-nano-wall.description = 纳米矿脉周围长出的活体防御墙。生命 1800、护甲 12，吸收激光并每秒自动恢复 45 生命，无需电力。
unit.cryon-nano-eroder.name = 蚀虫
unit.cryon-nano-eroder.description = 纳米殖群的六足侵蚀单位。追逐矿脉，沿途散布纳米地块，发射绿色脉冲激光攻击敌人。
unit.cryon-nano-eroder.details = 生命 520，护甲 4，绿色脉冲激光伤害 42、射程 13 格，每 40 帧发射一次。每半秒污染脚下及相邻地块；压制器能阻止它播种污染。

block.cryon-emp-bomb.name = EMP炸弹
block.cryon-emp-bomb.description = 放置后三秒引爆，释放电弧攻击敌人，并将电弧经过的纳米污染还原为原版金属废墟。
block.cryon-emp-bomb.details = 2×2，生命 200，无需电力。放置后 3 秒自动引爆，禁用不会停止引信。半径 20 格，释放 24 发向外飞行的穿透电弧弹，并向附近至多 4 个敌方单位、4 座敌方建筑追加瞄准弹。主弹每发伤害 480，飞行时每 8 帧向两侧释放原生闪电分支，分支伤害 60；多发弹幕可以叠加命中，单位受到 2 秒电击。友方及盟友不受伤害。弹体与闪电节点所经纳米地面变为损坏金属地板，纳米自然墙变为暗金属，纳米矿变为废料矿；正常地形与矿物保持。清除后的地面仍可能被相邻污染重新同化。引信随存档保存，提前摧毁或拆除不会触发 EMP。
bar.cryon-emp-fuse = EMP引爆：{0}秒



block.cryon-nano-warehouse.name = 纳米仓库
block.cryon-nano-warehouse.description = 纳米生物专属仓库，仅储存纳米材料。通过纳米管道和纳米桥接收矿物，通过失控装卸器供给工厂和裂解。不是核心，不影响区块占领或胜负。

block.cryon-rogue-nano-unloader.name = 失控装卸器
block.cryon-rogue-nano-unloader.description = 从背面的纳米仓库取出材料，送往正面的工厂或传送带。每秒最多转运 60 个，无需电力。

block.cryon-nano-large-factory.name = 纳米建造工厂
block.cryon-nano-large-factory.description = 纳米生物专属建造工厂。消耗30个纳米材料，每10秒生产一只六足织巢虫，支持扩建和恢复。5×5，需保留正面出厂通道。

block.cryon-nano-combat-factory.name = 战斗特化工厂
block.cryon-nano-combat-factory.description = 消耗 450 个纳米材料，每 30 秒生产一个裂甲者。5×5，正面五格必须为空，最多维持 24 个裂甲者。

block.cryon-nano-ultimate-factory.name = 失控终极工厂
block.cryon-nano-ultimate-factory.description = 消耗 4000 个纳米材料，每 90 秒生产一个歼灭体。7×7，正面七格必须为空，最多维持 4 个歼灭体。

block.cryon-nano-cleaver.name = 裂解
block.cryon-nano-cleaver.description = 纳米仓库的专属防御炮塔。持续绿色光束切割空中与地面敌人，射程 30 格，每秒消耗 10 个纳米材料，不耗电。


unit.cryon-nano-armor-breaker.name = 裂甲者
unit.cryon-nano-armor-breaker.description = 强大的六足纳米战斗特化体。生命 16000，护甲 28，双联穿甲脉冲激光撕开敌方防线。由战斗特化工厂生产。

unit.cryon-nano-annihilator.name = 歼灭体
unit.cryon-nano-annihilator.description = 纳米阵营的八足终极战争形态。生命 120000，护甲 70，主炮持续毁灭光束配合双联重型激光，摧毁敌方基地。由失控终极工厂消耗大量纳米材料生产。


item.cryon-database-nano.name = 纳米
item.cryon-database-boss.name = BOSS

unit.cryon-nano-weaver.name = 织巢虫
unit.cryon-nano-weaver.description = 六足建造工虫。到场施工、重建、修复殖群建筑，并拆除过时物流。矿脉孕育首批工虫，后续工虫消耗30纳米材料繁殖。
unit.cryon-nano-weaver.details = 容量120。建造消耗2×建筑边长²纳米材料，拆除回收约一半。每秒修复180+目标最大生命2%，每修复180生命消耗1材料。自身每秒恢复8生命。
block.cryon-nano-bridge.name = 纳米桥
block.cryon-nano-bridge.description = 纳米生物专属物品桥。连接同一直线、最多相距12格的桥端，跨越水面、墙体等障碍运输材料，无需电力。
block.cryon-nano-bridge.details = 管道输入桥端，再由另一端输出至管道或仓库。桥端由织巢虫实际施工；玩家不能制造。
