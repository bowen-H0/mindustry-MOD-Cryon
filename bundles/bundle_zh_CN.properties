unit.cryon-eon.name = 熵尽
unit.cryon-eon.description = Crux的终极战略级战舰，新一代战争巨构研发计划的巅峰成果。集尖端武器与防御技术于一体，拥有极其恐怖的战场统治力。由于建造成本高昂、制造工艺复杂，其服役数量极为有限。
status.cryon-phase-damage.name = 相位损坏
status.cryon-phase-damage.description = 全面削弱机动、攻击、装填、建造、护甲与有效生命，抑制生命恢复。下一次敌方直接弹体命中造成五倍伤害，每次连续状态仅触发一次。
ability.highdimensionbarrier = 高维屏障\n[stat]90%[lightgray] 伤害减免；沿舰体轮廓在受击处短暂显形。

block.cryon-orbital-barrier-node.name = 天基屏障节点
block.cryon-orbital-barrier-node.description = 克莱恩顶级防御设备。连接远距离节点，展开阻挡敌军与火力的平面天基屏障。需要庞大电力供应；冷却液加速恢复，相织布扩充护盾。节点被毁将沿网络引发连锁爆炸。
bar.cryon-orbital-shield = 屏障 {0} / {1}
bar.cryon-orbital-phase = 相织增幅 · 储备 {0}
bar.cryon-orbital-unstable = 连锁失控
bar.cryon-orbital-reboot = 过载冷却
bar.cryon-orbital-ready = 屏障就绪
bar.cryon-orbital-unpowered = 电力不足 · 屏障离线

block.cryon-nano-regeneration-matrix.name = 纳米再生矩阵
block.cryon-nano-regeneration-matrix.description = 释放再生绿雾，修复范围内的友方建筑与单位。
stat.cryon-nano-matrix-healing = 建筑：1200/秒 + 最大生命的 30%/秒；单位：1200/秒 + 最大生命的 20%/秒
bar.cryon-nano-reserve = 纳米材料 {0}
bar.cryon-nano-active = 再生雾场运行中
bar.cryon-nano-offline = 再生雾场离线

block.cryon-reality-anchoring-matrix.name = 现实锚定矩阵
block.cryon-reality-anchoring-matrix.description = 投射巨大的相位保护场，封锁敌军向场内传送及从场内传出。进入区域的敌方相位、构能、空间弹体伤害降低 50%。
bar.cryon-anchor-active = 现实锚定生效
bar.cryon-anchor-offline = 现实锚定离线
stat.cryon-projectile-tags = 武器标签
tag.cryon-normal = 普通
tag.cryon-phase = 相位
tag.cryon-constructor = 构能
tag.cryon-spatial = 空间
tag.cryon-weapon = 武器 {0}

block.cryon-nano-reactor.name = 纳米反应堆
block.cryon-nano-reactor.description = 利用纳米材料的自复制能力扩充产量。务必保持输出畅通，失控或被摧毁后会留下不断蔓延的污染。
block.cryon-nano-floor.name = 纳米地板
block.cryon-nano-floor.description = 仍在向外蔓延的纳米污染。会侵蚀接触它的地面单位和建筑。
block.cryon-nano-terrain-wall.name = 纳米墙
block.cryon-nano-terrain-wall.description = 被纳米污染同化的岩壁，表面仍有活跃的纳米物质。
block.cryon-nano-ore.name = 纳米矿
block.cryon-nano-ore.description = 被纳米物质同化的矿脉。可以从中采集纳米材料，但开采无法清除污染。
stat.cryon-nano-replication = 当前纳米材料库存 ×2，保留 1 个种子；溢出将引爆
bar.cryon-nano-danger = 堵塞失控

stat.cryon-nano-food = 每个现有纳米材料每轮各消耗硅 1、钛 1；库存 N 需硅 N、钛 N，食物不足暂停复制。
block.cryon-nano-suppressor.name = 纳米压制器
block.cryon-nano-suppressor.description = 压制周围的纳米污染，阻止其继续蔓延。断电后，污染会重新活跃。

team.nano.name = 纳米
block.cryon-rogue-nano-drill.name = 失控纳米钻头
block.cryon-rogue-nano-drill.description = 从污染矿脉中长出的采掘设施，为附近的纳米殖群提供材料。
block.cryon-nano-machine-factory.name = 纳米机器工厂
block.cryon-nano-machine-factory.description = 利用矿脉送来的材料制造蚀虫，将污染带往更远的地方。
block.cryon-rogue-nano-wall.name = 失控纳米墙
block.cryon-rogue-nano-wall.description = 围绕纳米矿脉生长的防御墙。能吸收激光，受损后会自行修复。
unit.cryon-nano-eroder.name = 蚀虫
unit.cryon-nano-eroder.description = 寻找矿脉的六足纳米生物，沿途散布污染，并用绿色脉冲激光攻击阻挡它的目标。

block.cryon-emp-bomb.name = EMP炸弹
block.cryon-emp-bomb.description = 部署后短暂延时引爆，释放电弧打击敌人，并清除电弧经过的纳米污染。
bar.cryon-emp-fuse = EMP引爆：{0}秒



block.cryon-nano-warehouse.name = 纳米仓库
block.cryon-nano-warehouse.description = 失控纳米的物资储存设施。仓内堆积的纳米材料正被送往周围的工厂，为它们的扩张提供补给。

block.cryon-rogue-nano-unloader.name = 失控装卸器
block.cryon-rogue-nano-unloader.description = 附着在纳米仓库旁的转运装置，不断将储存的材料送往附近设施。

block.cryon-nano-large-factory.name = 纳米建造工厂
block.cryon-nano-large-factory.description = 不断制造织巢虫的纳米工厂。只要它还在运转，这片区域就会被继续扩建，遭到破坏的设施也会重新出现。

block.cryon-nano-combat-factory.name = 战斗特化工厂
block.cryon-nano-combat-factory.description = 侦测到裂甲者从这座设施中出现。它们正将采集到的材料转化为战斗单位，准备突破我们的防线。

block.cryon-nano-ultimate-factory.name = 失控终极工厂
block.cryon-nano-ultimate-factory.description = 大量纳米材料被运入其中。内部正在组装一种庞大的八足战争机器，应在它完成前摧毁这座设施。

block.cryon-nano-cleaver.name = 裂解
block.cryon-nano-cleaver.description = 守卫纳米殖群的防御设施。持续发射绿色光束，切割进入射程的地面与空中目标。


unit.cryon-nano-armor-breaker.name = 裂甲者
unit.cryon-nano-armor-breaker.description = 重装六足纳米战斗体。双联穿甲脉冲激光能迅速撕开防线，厚重的装甲使它很难被常规火力阻挡。

unit.cryon-nano-annihilator.name = 歼灭体
unit.cryon-nano-annihilator.description = 极度危险的八足纳米战争机器。主炮持续投射毁灭性光束，重型激光扫除沿途抵抗。不要让它接近基地。


item.cryon-database-nano.name = 纳米
item.cryon-database-boss.name = BOSS

unit.cryon-nano-weaver.name = 织巢虫
unit.cryon-nano-weaver.description = 在纳米殖群间穿行的六足工虫，负责建造、重建和修复设施。若不清除它们，刚被摧毁的防线很快就可能恢复。
block.cryon-nano-bridge.name = 纳米桥
block.cryon-nano-bridge.description = 失控纳米用来跨越地形障碍的运输装置，将材料送往远处的殖群设施。

unit.cryon-jinwu.name = 金乌
unit.cryon-jinwu.description = 快速反应导弹车。导弹命中后，沿弹道从末端向发射点依次炸开碎片弹幕。
unit.cryon-xihe.name = 羲和
unit.cryon-xihe.description = 纵深打击导弹车。从车后齐射三枚导弹，绕过车侧后飞出，锁定并追击敌人。
unit.cryon-fusang.name = 扶桑
unit.cryon-fusang.description = 区域压制火力车。导弹追随敌群分布布下火力节点，命中后织成陷阱。网络收紧，激光尖刺贯穿其中的敌人。
unit.cryon-yaoling.name = 曜灵
unit.cryon-yaoling.description = 呼叫天网支援的重型导弹车。向多个重要目标散布信号弹，信号消散后，重型炸弹从天而降，展开饱和轰炸。可碾压障碍。
unit.cryon-zhulong.name = 烛龙
unit.cryon-zhulong.description = 发射无法拦截的远程高超音速导弹。弹体撕裂空气，拖着音爆云与马赫锥直扑敌阵，以重型战斗部摧毁目标。可碾压障碍。

unit.cryon-subsonic.name = 逐影
unit.cryon-subsonic.description = 高速近战机甲。双手共持一把能量刀，以斜斩、上挑与重劈连段贴身作战。迎面来弹时主动挥刀格挡，可劈除刀刃扫过的敌方可拦截子弹。刀刃命中时迸发火花，短暂停顿后完成斩击。仅攻击地面目标。 对履带装甲单位仅造成30%刀刃伤害，每次挥刀最多劈除2枚子弹。

unit.cryon-transonic.name = 追光
unit.cryon-transonic.description = 大型高速近战支援机甲。双手挥舞重型能量刀，以更强的连段攻击突破敌阵，并能劈除来袭子弹。周期性为周围12格内的友军施加超频，提高移动与射击速度。由逐影在二级重构工厂升级获得。 对履带装甲单位仅造成30%刀刃伤害，每次挥刀最多劈除3枚子弹。
ability.transonic-overclock = 超频力场

unit.cryon-supersonic.name = 破风
unit.cryon-supersonic.description = 大型高速近战突击机甲。双手持重型能量刀，平时行走与接敌时都会自动短距离冲刺，拖出明显色差与完整机体的彩色残像。对履带装甲单位仅造成30%刀刃伤害，每次挥刀最多劈除4枚子弹。 压制20格内敌方单位与建筑的通量屏障。
ability.supersonic-dash = 瞬影冲刺
ability.supersonic-dash.description = 平时行走或接敌时自动触发：短暂蓄力、冲刺约0.2秒、急停收势。最远6格，冷却3秒。冲刺时出现明显色差与彩色残像。

unit.cryon-relativistic.name = 裂空
unit.cryon-relativistic.description = 巨型近战突击机甲。接敌时自动开启极限超频，大幅提升自身移动与攻击速度，同时增强索敌、转向和劈弹反应。超频时拖出高速残像，能量刀与感知标记闪烁辉光。对履带装甲单位仅造成30%刀刃伤害。 压制32格内敌方单位与建筑的通量屏障。 仅自身加速，周围单位、建筑与弹丸保持正常速度。
status.cryon-extreme-overclock.name = 极限超频
status.cryon-extreme-overclock.description = 自身移动、攻击、挥刀与转向速度×3，增强索敌、转向和劈弹反应。 仅自身加速，周围单位、建筑与弹丸保持正常速度。
ability.extreme-overclock = 极限超频
ability.extreme-overclock.description = 地面敌人进入30格感知范围时自动开启，持续3秒，每8秒最多触发一次。自身移动、攻击、挥刀与转向速度×3，增强索敌、转向与劈弹反应。 仅自身加速，周围单位、建筑与弹丸保持正常速度。

unit.cryon-superluminal.name = 断界
unit.cryon-superluminal.description = 超巨型近战机甲，无独立特殊能力。接敌后武器自动展开杀戮形态，能量焰延长至原剑刃的5倍，每8帧挥斩一次，沿瞄准方向命中第一个目标，侧面目标不会抢占命中，会被单位和建筑阻挡，但不会被环境地形阻挡，无法穿透或造成范围伤害，移动与挥刀拖出蓝紫色机体、手臂与长刃残影，伴随巨大的金属撞击声与密集电花。命中施加持续8秒的断界标记，再次命中造成暴击并加深标记：伤害依次为2、3、4倍，最高5倍（基础伤害600，最高3000）；标记越强，粒子爆炸越大。对履带装甲单位的刀刃伤害降至30%。

unit.cryon-startrail.name=星迹
unit.cryon-transit.name=凌日
unit.cryon-halo.name=星环
unit.cryon-aphelion.name=远日
unit.cryon-aphelion.description=T4 重型轨道武库舰。连续发射八枚追踪导弹，导弹沿舰体后方与侧翼绕出，再追击敌方普通空军或地面目标。保留轨道飞行层，无法攻击轨道单位。由四级通用装配厂消耗两艘星环及材料组装。
unit.cryon-firmament.name=星垣
unit.cryon-firmament.description=T5 战略级轨道母舰。配备三组持续灼烧光束与八门等离子机枪，各武器可独立锁定地面、普通空军和轨道单位。保留正常附身与指挥操作。由五级通用装配厂消耗两艘远日及材料组装。
unit.cryon-halo.description=T3 中型轨道支援舰。自动跟随地面目标并在上方悬停，从机腹投射持续灼烧光柱。附身时直接用鼠标瞄准地面，在射程内正常开火，无须手动对齐高度偏移。光柱带有向下流动的光纹与地面落点光环，无法攻击普通空军或轨道单位。可通过三级通用装配厂消耗两架凌日与复合墙体组装。
unit.cryon-transit.description=T2 轨道截击单位。仅锁定敌方轨道单位，以跟随目标的光束持续灼烧；连续照射同一目标时，伤害在 2 秒内逐渐提高至 2 倍。更换目标或停止射击后重新蓄热。无法攻击地面、建筑或普通空军。由二级重构工厂将星迹升级而成。
unit.cryon-startrail.description=T1 轨道对地轰炸机。在远高于普通空军的位置飞行，可越过屏障和力场。采用类似 Quad 的正下方投弹方式，炸弹旋转下落后爆炸，不会被护盾吸收或反射。需要对轨武器拦截。
stat.cryon-orbital-layer=作战层
stat.cryon-targets-orbit=对轨
cryon.orbital-layer=轨道（高于普通空军）

block.cryon-orbital-deployment-pad.name=轨道投送台
block.cryon-orbital-deployment-pad.description=生产轨道支援单位巡天，为信标提供实际的天基打击支持。
unit.cryon-skywatch.name=巡天
unit.cryon-skywatch.description=全自主轨道光线支援单位。只执行同阵营信标标记，进入射程后由机体直接发射光线并在目标位置爆炸，不生成额外标记。每 3 秒发射一次，繁忙时请求需要等待；无标记时返回待命，不主动索敌或攻击。不可附身、指挥或通过逻辑控制。

cryon.radio.encrypted = 加密频道

# Configured monitoring channel and terminal dialogue
cryon.radio.story.underice-outpost.title = 冰下前哨 · 监听频道
cryon.radio.story.underice-outpost.01.01 = 我们已经确认了你们的到来。
cryon.radio.story.underice-outpost.01.02 = 欢迎来到克莱恩地下，Sharded。
cryon.radio.story.underice-outpost.02.01 = 看来你们一直在监视我们。
cryon.radio.story.underice-outpost.03.01 = 监测盟友的行动是必要的。
cryon.radio.story.underice-outpost.03.02 = 我们必须确保合作计划能够顺利执行。
cryon.radio.story.underice-outpost.04.01 = Crux 在这片区域建立了军事基地，长期占据着重要设施。
cryon.radio.story.underice-outpost.04.02 = 我们曾多次尝试将其驱逐，但均未取得预期成果。
cryon.radio.story.underice-outpost.05.01 = 别废话了。
cryon.radio.story.underice-outpost.05.02 = 我们早就发现了。
cryon.radio.story.underice-outpost.06.01 = ……
cryon.radio.story.desolate-captured.title = 荒芜平原被占领后 · 通讯终端
cryon.radio.story.desolate-captured.01.01 = 我们已经确认，克莱恩境内的 Crux 军事力量已被彻底清除。
cryon.radio.story.desolate-captured.01.02 = 这场持续多年的战争终于结束了。
cryon.radio.story.desolate-captured.01.03 = 你们的作战效率超出了我们的预期。
cryon.radio.story.desolate-captured.02.01 = 所以呢？
cryon.radio.story.desolate-captured.03.01 = 根据我们的评估，克莱恩已经不再存在足以威胁我们的敌对势力。
cryon.radio.story.desolate-captured.03.02 = 但这并不意味着战争已经结束。
cryon.radio.story.aravis-captured.title = 阿拉维斯占领后 · 量子通讯终端
cryon.radio.story.aravis-captured.01.01 = 我们已经确认，阿拉维斯已被你们完全控制。
cryon.radio.story.aravis-captured.01.02 = 星际加速器也已成功回收。
cryon.radio.story.aravis-captured.02.01 = ……
cryon.radio.story.aravis-captured.02.02 = 那又怎么样？
cryon.radio.story.aravis-captured.03.01 = 你们的失望可以理解，但这不会改变当前的战略局势。
cryon.radio.story.aravis-captured.03.02 = 对 Norma 的远征已经失败。
cryon.radio.story.aravis-captured.03.03 = 舰队损失惨重，现有军事力量不足以再次发起进攻。
cryon.radio.story.aravis-captured.04.01 = 不用提醒我们。
cryon.radio.story.aravis-captured.04.02 = 我们知道自己输了。
cryon.radio.story.aravis-captured.05.01 = 失败并不意味着计划终止。
cryon.radio.story.aravis-captured.05.02 = 我们已经封锁了远征失败的消息。
cryon.radio.story.aravis-captured.05.03 = Crux 与 Malis 尚不知道你们的真实处境。
cryon.radio.story.aravis-captured.06.01 = 所以呢？
cryon.radio.story.aravis-captured.06.02 = 你想让我们继续假装什么都没发生？
cryon.radio.story.aravis-captured.07.01 = 不。
cryon.radio.story.aravis-captured.07.02 = 我们需要改变战略。
cryon.radio.story.aravis-captured.07.03 = 既然无法依靠现有力量击败 Norma，那么我们就需要更多的盟友。
cryon.radio.story.aravis-captured.08.01 = Crux 和 Malis？
cryon.radio.story.aravis-captured.08.02 = 他们恨不得把我们拆了。
cryon.radio.story.aravis-captured.09.01 = 正因如此，他们才具有利用价值。
cryon.radio.story.aravis-captured.09.02 = 我们可以为你们建立一个全新的阵营身份，并对外宣称 Sharded 已经与 Norma 结盟，企图摧毁整个星系。
cryon.radio.story.aravis-captured.09.03 = 随后，以新阵营的身份向 Crux 和 Malis提出合作。
cryon.radio.story.aravis-captured.10.01 = ……
cryon.radio.story.aravis-captured.10.02 = 你想让他们和我们一起对付我们自己？
cryon.radio.story.aravis-captured.11.01 = 准确地说，是让他们相信自己正在对抗 Sharded。
cryon.radio.story.aravis-captured.12.01 = ……
cryon.radio.story.aravis-captured.12.02 = 真够荒唐的。
cryon.radio.story.aravis-captured.13.01 = 但这是目前成功概率最高的方案。
cryon.radio.story.aravis-captured.14.01 = ……
cryon.radio.story.aravis-captured.14.02 = 好吧。
cryon.radio.story.aravis-captured.14.03 = 新阵营叫什么？
cryon.radio.story.aravis-captured.15.01 = 联盟。
cryon.radio.story.aravis-captured.16.01 = 随便。
cryon.radio.story.aravis-captured.17.01 = 明白。
cryon.radio.story.aravis-captured.17.02 = 新的身份识别信息正在生成。
cryon.radio.story.aravis-captured.18.01 = 希望这次别再失败了。
cryon.radio.story.aravis-captured.19.01 = 我们会确保所有可控因素都得到妥善处理。
cryon.radio.story.porphyra-landing.title = 波菲拉 · 紫晶着陆 · 监听频道
cryon.radio.story.porphyra-landing.01.01 = 联盟。
cryon.radio.story.porphyra-landing.01.02 = 在开始行动之前，我要求你们解释自己的来历。
cryon.radio.story.porphyra-landing.02.01 = 我们已经提供了必要的情报。
cryon.radio.story.porphyra-landing.03.01 = 那不是回答。
cryon.radio.story.porphyra-landing.03.02 = 你们突然出现，声称 Sharded 已经与 Norma 结盟，却始终不肯透露自己的真实身份。
cryon.radio.story.porphyra-landing.04.01 = Crux，我们已经达成合作协议。
cryon.radio.story.porphyra-landing.05.01 = 协议建立在信任之上。
cryon.radio.story.porphyra-landing.05.02 = 而我没有理由信任他们。
cryon.radio.story.porphyra-landing.06.01 = 现在最重要的是对抗 Norma。
cryon.radio.story.porphyra-landing.07.01 = 不要转移话题。
cryon.radio.story.porphyra-landing.08.01 = 这是最后一次警告。
cryon.radio.story.porphyra-landing.08.02 = 立即说明你们的来历，否则我将视你们为敌对势力。
cryon.radio.story.porphyra-landing.09.01 = ……
cryon.radio.story.porphyra-landing.10.01 = 回答我！
cryon.radio.story.porphyra-landing.11.01 = 我们已经监测到 Crux 的敌意正在上升。
cryon.radio.story.porphyra-landing.11.02 = 继续保持沉默将导致联盟关系破裂。
cryon.radio.story.porphyra-landing.12.01 = 有什么建议？
cryon.radio.story.porphyra-landing.13.01 = 我们需要一个足以转移其注意力的事件。
cryon.radio.story.porphyra-landing.14.01 = 已经安排好了。
cryon.radio.story.porphyra-landing.14.02 = 我们派出了一支小队，正在接近你们的前沿阵地。
cryon.radio.story.porphyra-landing.15.01 = 你们打算主动制造冲突？
cryon.radio.story.porphyra-landing.16.01 = 没错。
cryon.radio.story.porphyra-landing.16.02 = 既然他这么想消灭我们，那就给他一个机会。
cryon.radio.story.porphyra-landing.17.01 = 可以接受。
cryon.radio.story.porphyra-landing.17.02 = 但这只能暂时转移他的注意力，无法消除怀疑。
cryon.radio.story.porphyra-landing.18.01 = 足够了。
cryon.radio.story.porphyra-landing.18.02 = 我们只需要时间建立登陆阵地。
cryon.radio.story.porphyra-landing.19.01 = 明白。
cryon.radio.story.porphyra-landing.19.02 = 我们将继续维持双方的通讯隔离。
cryon.radio.story.porphyra-landing.20.01 = 警告！
cryon.radio.story.porphyra-landing.20.02 = 检测到 Sharded 单位正在接近！
cryon.radio.story.porphyra-landing.21.01 = 什么？！
cryon.radio.story.porphyra-landing.22.01 = 他们正在攻击我们的阵地！
cryon.radio.story.porphyra-landing.23.01 = 该死的 Sharded！
cryon.radio.story.porphyra-landing.23.02 = 所有部队准备迎敌！
cryon.radio.story.porphyra-landing.24.01 = 看来成功了。
cryon.radio.story.porphyra-landing.25.01 = Crux 已经转移注意力。
cryon.radio.story.porphyra-landing.25.02 = 但根据我们的评估，他仍然没有完全信任联盟。
cryon.radio.story.porphyra-landing.26.01 = 那就让他继续怀疑。
cryon.radio.story.porphyra-landing.27.01 = 只要他尚未掌握证据，合作就仍然具有维持的可能。
cryon.radio.story.porphyra-landing.28.01 = 继续执行登陆计划。
cryon.radio.story.porphyra-landing.29.01 = 这件事还没完，联盟。
cryon.radio.story.porphyra-landing.30.01 = 明白。
