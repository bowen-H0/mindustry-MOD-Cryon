unit.cryon-vain.name = 虚妄
unit.cryon-vain.description = 灭世级战舰的专属护卫单位。拥有远超常规战舰的作战能力，并配备独立的单位制造系统，可在战斗中持续部署支援部队。其设计初衷并非独立作战，而是确保灭世能够在高强度交战中持续发挥火力优势。

unit.cryon-roche.name = 灭世
unit.cryon-roche.description = Crux的超T5级重型战舰。由四艘虚妄级护卫舰整合改装而成，通过复用成熟的舰体结构与武器系统，大幅降低了生产成本与制造难度。尽管结构冗杂、设计粗放，但其强大的火力与防御性能使其成为Crux舰队中广泛列装的重型作战单位。

unit.cryon-threshold.name = 视界
unit.cryon-threshold.description = Crux斥巨资研发的新一代旗舰，原计划成为舰队现代化改造的核心。然而，持续攀升的研发成本与严重的资金短缺迫使项目提前终止。如今投入战场的仅是一艘尚未完成全部系统整合的半成品，其真正的设计潜力从未得到验证。

unit.cryon-hyperion.name = 巨神
unit.cryon-hyperion.description = 先驱者文明遗留下来的古代巨型战舰。其武器系统与内部设备早已落后于现代战争技术，但庞大的舰体规模与厚重的装甲仍赋予其惊人的作战能力。这座来自旧时代的战争巨构，至今仍是不可忽视的威胁。







unit.cryon-jaspis.name = 碧玉
unit.cryon-obsidianum.name = 黑曜
unit.cryon-nitrum.name = 硝石
unit.cryon-hematites.name = 赤铁



