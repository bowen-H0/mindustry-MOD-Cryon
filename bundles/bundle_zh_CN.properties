# Deep-sea submarines and editor terrain
cryon.editor.underwater = 一键水下化
cryon.editor.underwater.description = 将全图地板转为海底地形并铺满水，同时开启水下环境。保留建筑、墙体、矿脉覆盖层和出生点；撤销可同时恢复地板和环境。
cryon.editor.underwater.done = 已将全图水下化，可使用撤销恢复原来的地板和环境。
cryon.editor.submerged-floor = 水下{0}
item.cryon-abyssal-sediment.name = 海底沉积物
item.cryon-abyssal-sediment.description = 从普通海底地板开采的松散沉积物，可加工得到干冰和镁。
block.cryon-sediment-separator.name = 沉积物分离机
block.cryon-sediment-separator.description = 将海底沉积物分离为干冰和镁。每2秒消耗6沉积物，产出2干冰和1镁；耗电60电力/秒，可直接建在水上。
cryon.allies.title = 盟友阵营
cryon.allies.description = 设置本地图玩家阵营的盟友。盟友之间互不攻击，单位、资源和指挥权各自独立。勾选盟友后默认开启自主作战和自主建造，也可在下方分别调整。请正常保存地图以保留设置。
cryon.allies.rts = 自主作战
cryon.allies.build = 自主建造
cryon.allies.wave-team = （波次阵营）
ability.cryon-deep-dive = 深潜
ability.cryon-deep-dive.description = 通过指令姿态切换深潜。航速降至55%；敌方单位或建筑靠近至{0}格内才能发现，同队共享发现信息。友军始终可见。深潜不提供无敌。
ability.cryon-sea-mines = 布设水雷
ability.cryon-sea-mines.description = 附近有敌军时，每{0}秒在艇尾布设水雷，每艇至多保有{1}枚。只对敌方舰艇触发，可引爆深潜目标。
stance.cryon-deep-dive = 深潜 / 上浮
status.cryon-deep-diving.name = 深潜
status.cryon-deep-diving.description = 降低航速并隐藏于远处敌人的侦测之外。
status.cryon-depth-pressure.name = 深压失能
status.cryon-depth-pressure.description = 未适应深海环境的单位无法战斗和建造，移动受限。潜艇及核心机不受影响。
stat.cryon-deepsea-adaptation = 深海适应
cryon.environment.planet-deepsea = 环境：寒冷、深海。仅能生产适应深海的潜艇，核心机可以正常工作；克莱恩工业建筑保持有效。敌人为Crux。
block.cryon-powered-pump.name = 动力泵
block.cryon-underice-current-generator.name = 冰下海流发电机
block.cryon-underice-current-generator.description = 利用冰下水流持续发电。仅用于水下环境，2×2占地必须全部覆盖水域（含液体浅滩）。无需燃料、管道或启动电力，稳定输出120电力/秒。无法在陆地、岩浆或其他液体上发电。
cryon.generator.requires-water = 必须完全建造在水域上
block.cryon-powered-pump.description = 利用电力泵取液体。覆盖4格同种液体时每秒输出60单位；消耗90电力/秒，液体容量120。
block.cryon-abyssal-mine.name = 深海水雷
block.cryon-abyssal-mine.description = 部署在水道中，1.5秒后武装。敌方舰艇进入近距后触发一次毁伤爆炸，不会因友军或空军靠近而引爆。
unit.cryon-minimus.name = Minimus
unit.cryon-minimus.description = 初级支援潜艇。修复光束、治疗激光弹与轻型鱼雷。
unit.cryon-danae.name = Danae
unit.cryon-danae.description = 中级护航潜艇。新增点防御与水雷布设。
unit.cryon-pammelas.name = Pammelas
unit.cryon-pammelas.description = 重型支援潜艇。装备缓慢惯性滑行的重型鱼雷，造成大范围毁伤。
unit.cryon-schmidti.name = Schmidti
unit.cryon-schmidti.description = 大型深海支援潜艇。重型鱼雷、修复场、点防御和水雷。
unit.cryon-sloani.name = Sloani
unit.cryon-sloani.description = 旗舰级潜艇。毁灭性重型鱼雷与大范围修复支援。
