cryon.radio.story.cryon-sector-1.01.01 = 这里是 Crux。
cryon.radio.story.cryon-sector-1.01.02 = 克莱恩属于我们的控制区域。
cryon.radio.story.cryon-sector-1.02.01 = 这是最后一次警告。
cryon.radio.story.cryon-sector-1.02.02 = 任何试图进入克莱恩的 Sharded 单位，都将被视为入侵者。
cryon.radio.story.cryon-sector-1.03.01 = 不要试探我们的底线。
cryon.radio.story.cryon-sector-1.03.02 = 我们已经做好了应对准备。
