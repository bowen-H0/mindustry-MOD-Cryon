block.cryon-crystal-statue-5.description = 重结晶留下的单位雕塑，可破坏的静态方块。

item.cryon-gamma-crystal.name = 伽马晶体
item.cryon-gamma-crystal.description = 在波菲拉浅层结晶带形成的基础晶体，可由初始设备开采，直接用于自动化设备、电池和单位工厂的电子结构。
block.cryon-ore-gamma-crystal.name = 伽马晶体矿

