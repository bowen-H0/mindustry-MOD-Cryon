block.cryon-abyss-pressure-slate.name = 深压板岩
block.cryon-abyss-obsidian.name = 深海黑曜岩
block.cryon-abyss-limestone.name = 海相石灰岩
block.cryon-abyss-black-silt.name = 深海黑泥
