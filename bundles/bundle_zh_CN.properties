cryon.radio.story.exclusion-zone.title = 克莱恩 · 毁灭禁区 · 监听频道
cryon.radio.story.exclusion-zone.01.01 = 所有作战单位已接到命令。
cryon.radio.story.exclusion-zone.01.02 = 进攻即将开始。
cryon.radio.story.exclusion-zone.02.01 = 我们不会允许你们离开这片区域。
cryon.radio.story.exclusion-zone.03.01 = 那就试试看。
